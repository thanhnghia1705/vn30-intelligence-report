name: "VN30 Daily Intelligence Email Report"

on:
  schedule:
    # 03:15 UTC hàng ngày = 10:15 sáng Giờ Việt Nam (UTC+7)
    # Lựa chọn phút lẻ :15 giúp tránh tình trạng nghẽn hàng đợi (queue) máy chủ đám mây của GitHub
    - cron: '15 3 * * *'
  
  # Cho phép bấm nút "Run workflow" để chạy thử bằng tay bất kỳ lúc nào
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Tải mã nguồn về Runner (Checkout Repository)
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: 📦 Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🚀 Chạy script phân tích và gửi email tự động
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER || 'nguyenthanhnghia1705@gmail.com' }}
        run: |
          python report.py
